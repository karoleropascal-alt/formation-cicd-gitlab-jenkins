stages:
  - build
  - test
  - package
  - deploy

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"

cache:
  paths:
    - .m2/repository
    - mon-app/target

build_job:
  stage: build
  script:
    - cd mon-app
    - mvn compile

test_job:
  stage: test
  needs: ["build_job"]
  script:
    - cd mon-app
    - mvn test
  artifacts:
    reports:
      junit: mon-app/target/surefire-reports/TEST-*.xml
    when: always

lint_job:
  stage: test
  needs: ["build_job"]
  script:
    - cd mon-app
    - echo "🔍 Vérification du style de code..."
    - mvn compile -q
    - echo "✅ Style OK"

package_job:
  stage: package
  needs: ["test_job", "lint_job"]
  script:
    - cd mon-app
    - mvn package -DskipTests
  artifacts:
    paths:
      - mon-app/target/*.jar
    expire_in: 1 week

deploy_job:
  stage: deploy
  needs: ["package_job"]
  script:
    - echo "🚀 Déploiement vers la production..."
    - echo "✅ Déploiement réussi"
  environment:
    name: production
    url: http://localhost:8080
  only:
    - main
  when: manual
