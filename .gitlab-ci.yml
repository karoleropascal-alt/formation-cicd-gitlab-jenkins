stages:
  - build
  - test
  - package
  - deploy

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"

cache:
  paths:
    - .m2/repository
    - mon-app/target

build_job:
  stage: build
  image: maven:3.9-eclipse-temurin-17
  tags:
    - docker-runner
  script:
    - cd mon-app
    - mvn compile

test_job:
  stage: test
  image: maven:3.9-eclipse-temurin-17
  script:
    - cd mon-app
    - mvn test jacoco:report
    - cat target/site/jacoco/index.html | grep -o 'Total[^%]*%' | head -1
  coverage: '/Total.*?([0-9]{1,3})%/'
  artifacts:
    reports:
      junit: mon-app/target/surefire-reports/TEST-*.xml
      coverage_report:
        coverage_format: jacoco
        path: mon-app/target/site/jacoco/jacoco.xml
    paths:
      - mon-app/target/site/jacoco/

lint_job:
  stage: test
  needs: ["build_job"]
  script:
    - cd mon-app
    - echo "🔍 Vérification du style de code..."
    - mvn compile -q
    - echo "✅ Style OK"

package_job:
  stage: package
  needs: ["test_job", "lint_job"]
  script:
    - cd mon-app
    - mvn package -DskipTests
  artifacts:
    paths:
      - mon-app/target/*.jar
    expire_in: 1 week

deploy_job:
  stage: deploy
  needs: ["package_job"]
  script:
    - echo "🚀 Déploiement vers la production..."
    - echo "✅ Déploiement réussi"
  environment:
    name: production
    url: http://localhost:8080
  only:
    - main
  when: manual
