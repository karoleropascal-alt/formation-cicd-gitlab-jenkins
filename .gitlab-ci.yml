stages:
  - build
  - test
  - package
  - deploy-staging
  - api-test

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"

cache:
  paths:
    - .m2/repository
    - mon-app/target

build_job:
  stage: build
  image: maven:3.9-eclipse-temurin-17
  tags:
    - docker-runner
  script:
    - cd mon-app
    - mvn compile

unit_tests:
  stage: test
  image: maven:3.9-eclipse-temurin-17
  script:
    - cd mon-app
    - mvn test
  artifacts:
    reports:
      junit: mon-app/target/surefire-reports/TEST-*.xml

coverage:
  stage: test
  image: maven:3.9-eclipse-temurin-17
  needs: ["unit_tests"]
  script:
    - cd mon-app
    - mvn test jacoco:report
    - cat target/site/jacoco/index.html | grep -o 'Total[^%]*%' | head -1
  coverage: '/Total.*?([0-9]{1,3})\s*%/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: jacoco
        path: mon-app/target/site/jacoco/jacoco.xml
    paths:
      - mon-app/target/site/jacoco/

lint_job:
  stage: test
  needs: ["build_job"]
  script:
    - cd mon-app
    - echo "🔍 Vérification du style de code..."
    - mvn compile -q
    - echo "✅ Style OK"

api_tests:
  stage: test
  image: maven:3.9-eclipse-temurin-17
  needs: ["unit_tests"]
  script:
    - cd mon-app
    - mvn test -Dtest=UserApiTest
  artifacts:
    reports:
      junit: mon-app/target/surefire-reports/TEST-*.xml

package_job:
  stage: package
  needs: ["unit_tests", "coverage", "lint_job"]
  script:
    - cd mon-app
    - mvn package -DskipTests
  artifacts:
    paths:
      - mon-app/target/*.jar
    expire_in: 1 week

deploy_staging:
  stage: deploy-staging
  needs: ["package_job"]
  script:
    - echo "🚀 Déploiement vers staging..."
    - echo "✅ Déploiement staging réussi"
  environment:
    name: staging
    url: http://localhost:8080

smoke_api:
  stage: api-test
  image: postman/newman:alpine
  needs: ["deploy_staging"]
  script:
    - newman run collection.json -e staging-env.json --reporters cli,junit --reporter-junit-export newman-report.xml
  artifacts:
    reports:
      junit: newman-report.xml
