stages:
  - build
  - test
  - package

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"

cache:
  paths:
    - .m2/repository
    - mon-app/target

build_job:
  stage: build
  script:
    - cd mon-app
    - mvn compile

test_job:
  stage: test
  script:
    - cd mon-app
    - mvn test
  artifacts:
    reports:
      junit: mon-app/target/surefire-reports/TEST-*.xml
    when: always

package_job:
  stage: package
  script:
    - cd mon-app
    - mvn package -DskipTests
  artifacts:
    paths:
      - mon-app/target/*.jar
    expire_in: 1 week
