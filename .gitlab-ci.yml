# ═══════════════════════════════════════════════════════
# PIPELINE CI/CD COMPLET — mon-api-java
# ═══════════════════════════════════════════════════════

stages:
  - build
  - test
  - security
  - deploy-staging
  - api-test
  - deploy-prod

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  IMAGE_NAME: "mon-registry/mon-app"
  IMAGE_TAG: "$CI_COMMIT_SHA"

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .m2/repository

build_job:
  stage: build
  image: maven:3.9-eclipse-temurin-17
  tags:
    - docker-runner
  script:
    - cd mon-app
    - mvn clean package -DskipTests
  artifacts:
    paths:
      - mon-app/target/*.jar
    expire_in: 1 week

test_job:
  stage: test
  image: maven:3.9-eclipse-temurin-17
  tags:
    - docker-runner
  needs: ["build_job"]
  script:
    - cd mon-app
    - mvn test
    - mvn jacoco:report
  coverage: '/Total.*?([0-9]{1,3})\s*%/'
  artifacts:
    reports:
      junit: mon-app/target/surefire-reports/TEST-*.xml
    paths:
      - mon-app/target/site/jacoco/
    expire_in: 1 week

sast_job:
  stage: security
  image: returntocorp/semgrep
  tags:
    - docker-runner
  needs: ["build_job"]
  script:
    - cd mon-app
    - echo "🔒 Analyse SAST..."
    - semgrep --config=auto --json --output=semgrep.json . || true
  artifacts:
    paths:
      - mon-app/semgrep.json
  allow_failure: true

deploy_staging:
  stage: deploy-staging
  needs: ["test_job"]
  script:
    - echo "🚀 Déploiement staging (image $IMAGE_NAME:$IMAGE_TAG)..."
    - echo "✅ Déployé sur http://localhost:8080"
  environment:
    name: staging
    url: http://localhost:8080
  tags:
    - docker-runner

api_tests:
  stage: api-test
  image: postman/newman:alpine
  tags:
    - docker-runner
  needs: ["deploy_staging"]
  script:
    - cd mon-app
    - newman run ../collection.json -e ../staging-env.json --reporters cli,junit --reporter-junit-export newman-report.xml
  artifacts:
    reports:
      junit: mon-app/newman-report.xml

deploy_prod:
  stage: deploy-prod
  needs: ["api_tests"]
  script:
    - echo "🏭 Déploiement production (image $IMAGE_NAME:$IMAGE_TAG)..."
    - echo "✅ Déployé en production"
  environment:
    name: production
  when: manual
  only:
    - main
  tags:
    - docker-runner